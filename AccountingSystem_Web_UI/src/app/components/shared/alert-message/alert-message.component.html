<mat-card style="padding: o !important;">
    <div id="alert-message-container" class="confirmation-messaje">
        <div mat-dialog-content>
            <img src="assets/img/info.gif" alt="">
            <br>
            <div>
                <p>{{data.description}}</p>
            </div>
            <div>
                <button mat-button [mat-dialog-close]="true">{{data.buttonText}}</button>
                <button mat-button [mat-dialog-close]="false">No, gracias!</button>
            </div>
        </div>
    </div>
</mat-card>
