<mat-card class="create-form-container">
    <mat-dialog-content>
        <mat-progress-bar *ngIf="progressBar" mode="indeterminate"></mat-progress-bar>

        <mat-card-header>
            <mat-card-title>{{title}}</mat-card-title>
        </mat-card-header>


        <mat-card-content>
            <mat-card class="mat-card-form-container">
                <form id="customerForm" [formGroup]="customerForm" (ngSubmit)="onSubmit()" novalidate class="example-form col">
                    <mat-form-field class="example-full-width form-inputs">
                        <mat-label>Nombre</mat-label>
                        <input name="name" [(ngModel)]="data.name" maxlength="120" #customerName matInput formControlName="name">
                        <mat-hint align="end">{{customerName.value.length}} / 120</mat-hint>
                        <mat-error>El nombre es requerido</mat-error>
                    </mat-form-field>
                    <br>
                    <mat-form-field class="example-full-width form-inputs">
                        <mat-label>Identificación</mat-label>
                        <input oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);" name="identification" [(ngModel)]="data.identification" maxlength="25" #customerIdentification matInput formControlName="identification">
                        <mat-hint align="end">{{customerIdentification.value.length}} / 25</mat-hint>
                    </mat-form-field>
                    <br>
                    <mat-form-field class="example-full-width form-inputs">
                        <mat-label>Correo</mat-label>
                        <input name="email" [(ngModel)]="data.email" maxlength="50" #customerEmail matInput formControlName="email">
                        <mat-hint align="end">{{customerEmail.value.length}} / 50</mat-hint>
                        <mat-error *ngIf="customerForm.get('email').hasError('email')">Ingresa un correo valido</mat-error>
                    </mat-form-field>
                    <br>
                    <mat-form-field class="example-full-width form-inputs">
                        <mat-label>Teléfono</mat-label>
                        <input oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);" name="telephone" [(ngModel)]="data.telephone" #customerPhone maxlength="20" matInput formControlName="telephone">
                        <mat-hint align="end">{{customerPhone.value.length}} / 20</mat-hint>
                    </mat-form-field>
                    <br>
                    <mat-form-field class="example-full-width form-inputs">
                        <mat-label>Dirección</mat-label>
                        <input name="address" [(ngModel)]="data.address" #customerAddress maxlength="150" matInput formControlName="address">
                        <mat-hint align="end">{{customerAddress.value.length}} / 150</mat-hint>
                    </mat-form-field>
                </form>
            </mat-card>
        </mat-card-content>
    </mat-dialog-content>
    <mat-card-actions class="buttonsForms">
        <button (click)="closeDialog()" class="btnCancel" mat-button>Cancelar</button>
        <button class="btnCreate" form="customerForm" mat-button>Guardar</button>
    </mat-card-actions>
</mat-card>
